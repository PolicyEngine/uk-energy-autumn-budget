[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-budget"
version = "0.1.0"
description = "UK household energy bills at forecast prices and Autumn Budget 2026 support options, scored with PolicyEngine on Microcosm UK."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "PolicyEngine", email = "hello@policyengine.org" }]
dependencies = [
    # policyengine.py pins the UK model version and certified bundle.
    "policyengine[uk]==6.8.0",
    "huggingface-hub",
    "microdf-python>=1.2.0",
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
energy-budget = "energy_budget.build:main"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_budget"]
