name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.13 .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/ruff format --check src tests
      # Unit and household-calculation tests; no population data is needed.
      - run: .venv/bin/python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test src/lib
      - run: bun run build
